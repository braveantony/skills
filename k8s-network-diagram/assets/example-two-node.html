<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pod-to-Service packet path across two nodes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
<style>
  html, body { margin: 0; background: #ffffff; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  svg { width: 100%; max-width: 1600px; height: auto; display: block; }
  text { font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; fill: #000; }
  .box { fill: #fff; stroke: #000; stroke-width: 1.5; }
  .ln { fill: none; stroke: #000; stroke-width: 1.5; }
  .lbl { font-size: 20px; text-anchor: middle; dominant-baseline: central; }
  .sm { font-size: 18px; text-anchor: middle; dominant-baseline: central; }
  .tag { font-size: 15px; text-anchor: middle; dominant-baseline: central; }
  .ip { font-size: 20px; font-weight: 700; dominant-baseline: central; }
  .co { font-size: 17px; dominant-baseline: central; }
  .num { font-size: 16px; font-weight: 700; fill: #E02020; text-anchor: middle; dominant-baseline: central; }
  .nc { fill: #fff; stroke: #E02020; stroke-width: 2; }
  .pp { fill: none; stroke: #7B5EA7; stroke-width: 3; stroke-dasharray: 8 6; }
  .gp { fill: none; stroke: #9CC43A; stroke-width: 3; stroke-dasharray: 8 6; }
  .pb { fill: #7B5EA7; }
  .gb { fill: #C5DC6B; }
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">Pod-to-Service packet path across two Kubernetes nodes</title>
  <desc id="d">Pod1 on the left node sends a request through lxc00aa, kernel routing and bond0 to the underlying network; the right node receives it on bond0 and delivers it through to-container and lxc00dd to Pod4.</desc>
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7B5EA7"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9CC43A"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <path class="ln" d="M248 562 C248 660 400 665 500 655"/>
  <path class="ln" d="M342 562 C342 620 450 630 530 630"/>
  <path class="ln" d="M938 562 C938 620 830 630 750 630"/>
  <path class="ln" d="M1032 562 C1032 660 880 665 780 655"/>

  <g fill="#595959">
    <ellipse cx="640" cy="652" rx="150" ry="40"/>
    <circle cx="520" cy="648" r="32"/>
    <circle cx="565" cy="628" r="40"/>
    <circle cx="635" cy="614" r="46"/>
    <circle cx="710" cy="626" r="42"/>
    <circle cx="762" cy="648" r="32"/>
  </g>
  <text x="640" y="652" class="lbl" style="fill:#fff">Underlying (routing) network</text>

  <rect x="30" y="24" width="570" height="520" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="680" y="24" width="570" height="520" fill="none" stroke="#000" stroke-width="2"/>

  <polygon points="70,483 89,494 89,516 70,527 51,516 51,494" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="1210,483 1229,494 1229,516 1210,527 1191,516 1191,494" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>

  <rect class="box" x="50" y="44" width="150" height="110"/>
  <text x="125" y="64" class="lbl">Pod1</text>
  <rect class="box" x="65" y="82" width="120" height="60"/>
  <text x="125" y="101" class="sm">10.1.1.2</text>
  <text x="125" y="124" class="sm">eth0</text>
  <line class="ln" x1="150" y1="154" x2="150" y2="206"/>
  <rect class="box" x="50" y="206" width="150" height="56"/>
  <text x="125" y="240" class="lbl">lxc00aa</text>
  <rect class="gb" x="42" y="194" width="70" height="24"/>
  <text x="77" y="206" class="tag">ingress</text>
  <rect x="50" y="318" width="150" height="48" fill="#F28C28"/>
  <text x="125" y="342" class="sm">Kernel routing</text>

  <rect class="box" x="230" y="430" width="130" height="44"/>
  <text x="295" y="452" class="lbl">bond0</text>
  <rect class="gb" x="232" y="408" width="62" height="22"/>
  <text x="263" y="419" class="tag">ingress</text>
  <rect class="pb" x="296" y="408" width="62" height="22"/>
  <text x="327" y="419" class="tag" style="fill:#fff">egress</text>
  <text x="372" y="452" class="ip">10.255.255.11</text>
  <path class="ln" d="M295 474 V500 M248 526 V500 H342 V526"/>
  <rect class="box" x="215" y="526" width="66" height="36"/>
  <text x="248" y="544" class="sm">eth0</text>
  <rect class="box" x="309" y="526" width="66" height="36"/>
  <text x="342" y="544" class="sm">eth1</text>

  <rect class="box" x="1080" y="44" width="150" height="110"/>
  <text x="1155" y="64" class="lbl">Pod4</text>
  <rect class="box" x="1095" y="82" width="120" height="60"/>
  <text x="1155" y="101" class="sm">10.2.2.4</text>
  <text x="1155" y="124" class="sm">eth0</text>
  <line class="ln" x1="1130" y1="154" x2="1130" y2="206"/>
  <rect class="box" x="1080" y="206" width="150" height="56"/>
  <text x="1155" y="240" class="lbl">lxc00dd</text>
  <rect class="gb" x="1168" y="194" width="70" height="24"/>
  <text x="1203" y="206" class="tag">ingress</text>
  <rect class="pb" x="1090" y="326" width="120" height="30"/>
  <text x="1150" y="341" class="tag" style="fill:#fff">to-container</text>

  <rect class="box" x="920" y="430" width="130" height="44"/>
  <text x="985" y="452" class="lbl">bond0</text>
  <rect class="gb" x="922" y="408" width="62" height="22"/>
  <text x="953" y="419" class="tag">ingress</text>
  <rect class="pb" x="986" y="408" width="62" height="22"/>
  <text x="1017" y="419" class="tag" style="fill:#fff">egress</text>
  <text x="1062" y="452" class="ip">10.255.255.22</text>
  <path class="ln" d="M985 474 V500 M938 526 V500 H1032 V526"/>
  <rect class="box" x="905" y="526" width="66" height="36"/>
  <text x="938" y="544" class="sm">eth0</text>
  <rect class="box" x="999" y="526" width="66" height="36"/>
  <text x="1032" y="544" class="sm">eth1</text>

  <path class="pp" d="M90 142 V191" marker-end="url(#ap)"/>
  <path class="pp" d="M90 262 V315" marker-end="url(#ap)"/>
  <path class="pp" d="M125 366 C125 412 290 362 322 404" marker-end="url(#ap)"/>
  <path class="pp" d="M350 432 V523" marker-end="url(#ap)"/>

  <path class="gp" d="M930 524 V434" marker-end="url(#ag)"/>
  <path class="gp" d="M972 406 C972 385 1010 392 1030 365 C1045 345 1060 341 1086 341" marker-end="url(#ag)"/>
  <path class="gp" d="M1190 326 V266" marker-end="url(#ag)"/>
  <path class="gp" d="M1190 192 V146" marker-end="url(#ag)"/>

  <g>
    <polygon class="pb" points="232,62 232,84 190,112"/>
    <rect class="pb" x="230" y="40" width="300" height="62" rx="6"/>
    <circle class="nc" cx="254" cy="71" r="14"/><text x="254" y="71" class="num">1</text>
    <text x="278" y="59" class="co"># Access &lt;ServiceIP:Port&gt;</text>
    <text x="278" y="83" class="co">$ curl 10.224.1.1:80</text>
  </g>
  <g>
    <polygon class="pb" points="232,186 232,210 204,232"/>
    <rect class="pb" x="230" y="120" width="360" height="112" rx="6"/>
    <circle class="nc" cx="254" cy="140" r="14"/><text x="254" y="140" class="num">2</text>
    <text x="278" y="140" class="co">Service handling:</text>
    <text x="278" y="164" class="co">1. Service load balancing (select backend)</text>
    <text x="278" y="188" class="co">2. Perform DNAT (ServiceIP -&gt; Pod4_IP)</text>
    <text x="278" y="212" class="co">3. All via BPF</text>
  </g>
  <g>
    <polygon class="pb" points="242,300 242,324 204,340"/>
    <rect class="pb" x="240" y="250" width="240" height="86" rx="6"/>
    <circle class="nc" cx="264" cy="270" r="14"/><text x="264" y="270" class="num">3</text>
    <text x="288" y="270" class="co">Kernel routing</text>
    <text x="288" y="294" class="co">1. Determine next hop</text>
    <text x="288" y="318" class="co">2. Determine dst MAC</text>
  </g>
  <g>
    <polygon class="pb" points="366,388 392,388 336,408"/>
    <rect class="pb" x="350" y="346" width="236" height="44" rx="6"/>
    <circle class="nc" cx="374" cy="368" r="14"/><text x="374" y="368" class="num">4</text>
    <text x="398" y="368" class="co">Do nothing for this case.</text>
  </g>

  <circle class="nc" cx="640" cy="540" r="15"/><text x="640" y="540" class="num">5</text>

  <g>
    <polygon class="gb" points="920,372 946,372 946,406"/>
    <rect class="gb" x="694" y="286" width="296" height="88" rx="6"/>
    <circle class="nc" cx="718" cy="306" r="14"/><text x="718" y="306" class="num">6</text>
    <text x="742" y="306" class="co">Determine src identity</text>
    <text x="742" y="330" class="co">1. Determine dst endpoint</text>
    <text x="742" y="354" class="co">2. Tail call to dst endpoint's BPF</text>
  </g>
  <g>
    <polygon class="gb" points="1010,248 1036,248 1102,322"/>
    <rect class="gb" x="760" y="186" width="290" height="64" rx="6"/>
    <circle class="nc" cx="784" cy="206" r="14"/><text x="784" y="206" class="num">7</text>
    <text x="808" y="206" class="co">Ingress policy checking</text>
    <text x="808" y="230" class="co">(equivalent to lxc00dd's egress)</text>
  </g>
  <g>
    <polygon class="gb" points="1028,92 1028,112 1091,112"/>
    <rect class="gb" x="830" y="80" width="200" height="44" rx="6"/>
    <circle class="nc" cx="854" cy="102" r="14"/><text x="854" y="102" class="num">8</text>
    <text x="878" y="102" class="co">Arrived destination</text>
  </g>
</svg>
</body>
</html>
